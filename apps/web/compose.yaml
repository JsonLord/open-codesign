services:
  codesign-web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    ports:
      - "7860:7860"
    environment:
      CODESIGN_PROJECTS_DIR: /app
      PORT: 7860
      # Configure these through an env file or deployment secrets to enable generation.
      CODESIGN_PROVIDER: ${CODESIGN_PROVIDER:-}
      CODESIGN_MODEL: ${CODESIGN_MODEL:-}
      CODESIGN_API_KEY: ${CODESIGN_API_KEY:-}
    volumes:
      - codesign-web-data:/app
    restart: unless-stopped

volumes:
  codesign-web-data:
